<head>

    <title>G.Sinai | Matriz Kraljic</title>
    
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f6f5f5; /* Cor de fundo atualizada para o Light Mode do Projeto Maná */
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .app-iframe {
            border: 0;
            width: 100%;
            /* Ajuste para ocultar o cabeçalho padrão do Google Apps Script */
            height: calc(100vh + 8px); 
            position: absolute;
            top: -8px; 
            left: 0;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe class="app-iframe" src="https://script.google.com/macros/s/AKfycbxbCuQuMWrGDSBOSfEf69icwxgbZMuXiQISbw5lUJQEGoKHi7FjYNfxmofqoRMao8MaGw/exec" allowfullscreen></iframe>
    </div>

</body>
